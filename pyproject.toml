[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-recognition-pipeline"
version = "0.1.0"
description = "A laptop-based facial recognition pipeline built for learning"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python==4.14.0.94",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
detect-faces = "face_pipeline.detect:main"
download-face-models = "face_pipeline.download_models:main"
enroll-face = "face_pipeline.enroll:main"
evaluate-recognition = "face_pipeline.evaluate:main"
extract-face-embeddings = "face_pipeline.extract_embeddings:main"
recognize-faces = "face_pipeline.recognize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
